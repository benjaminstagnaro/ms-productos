name: CI/CD ms-productos

on:
  push:
    branches:
      - main            # CI + CD: se despliega en el entorno simulado
  pull_request:
    branches:
      - main            # solo CI: pruebas, seguridad y build (sin desplegar)
  workflow_dispatch:    # ejecución manual desde la pestaña Actions
    inputs:
      simular_falla:
        description: 'Demostración: inyecta una falla crítica para comprobar que el pipeline se detiene'
        type: choice
        default: ninguna
        options:
          - ninguna
          - prueba-fallida              # bug en la regla de stock -> fallan las pruebas
          - vulnerabilidad-dependencia  # log4j 2.14.1 (Log4Shell) -> Snyk bloquea
          - secreto-expuesto            # credenciales en el código -> gitleaks bloquea
          - politica-kubernetes         # contenedor privilegiado y root -> políticas OPA bloquean
          - despliegue-defectuoso       # versión que no arranca -> rollback automático en Kubernetes

# Si llega un nuevo commit a un PR se cancela la ejecución anterior (ahorra minutos).
# En main no se cancela, para no cortar un despliegue a medias.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Mínimo privilegio: por defecto el GITHUB_TOKEN solo puede leer el código.
# Cada job pide explícitamente los permisos extra que necesita.
permissions:
  contents: read

# Las acciones de terceros (fuera de la organización "actions" de GitHub) se fijan por
# commit SHA para que nadie pueda cambiar su código moviendo una etiqueta; Dependabot las actualiza.
env:
  JAVA_VERSION: '17'
  IMAGE_NAME: ms-productos
  SNYK_CLI_VERSION: v1.1308.3   # versión fija de la CLI de Snyk
  SIMULAR_FALLA: ${{ inputs.simular_falla || 'ninguna' }}
  PLAYWRIGHT_VERSION: 1.65.1    # captura del dashboard de Grafana como evidencia

jobs:

  # 1. Pruebas unitarias y cobertura con JaCoCo
  test:
    name: Pruebas unitarias + JaCoCo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      cobertura-lineas: ${{ steps.resumen.outputs.cobertura_lineas }}
      cobertura-ramas: ${{ steps.resumen.outputs.cobertura_ramas }}
      pruebas-total: ${{ steps.resumen.outputs.pruebas_total }}
      pruebas-fallidas: ${{ steps.resumen.outputs.pruebas_fallidas }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # DEMOSTRACIÓN (IE6): se introduce un bug que permite dejar el stock en negativo.
      # Las pruebas lo detectan y el pipeline se detiene antes de construir la imagen.
      - name: "Simulación: regresión en la regla de negocio"
        if: env.SIMULAR_FALLA == 'prueba-fallida'
        run: |
          echo "::warning title=Simulación::Se introduce a propósito un bug en ProductoService (permite stock negativo)"
          sed -i 's/if (nuevoStock < 0) {/if (nuevoStock < -1000000) {/' src/main/java/cl/duoc/productos/service/ProductoService.java
          git diff --stat

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'        # cachea ~/.m2 entre ejecuciones

      # verify = compila + pruebas + reporte JaCoCo + jacoco:check (cobertura mínima 80 %)
      - name: Build and test
        run: mvn -B -ntp clean verify

      - name: Resumen de pruebas y cobertura
        id: resumen
        if: always()
        run: |
          TOTAL=0; FALLOS=0
          for f in target/surefire-reports/TEST-*.xml; do
            [ -f "$f" ] || continue
            T=$(grep -o -m1 ' tests="[0-9]*"' "$f" | grep -o '[0-9]*')
            F=$(grep -o -m1 ' failures="[0-9]*"' "$f" | grep -o '[0-9]*')
            E=$(grep -o -m1 ' errors="[0-9]*"' "$f" | grep -o '[0-9]*')
            TOTAL=$((TOTAL + T)); FALLOS=$((FALLOS + F + E))
          done
          {
            echo "## 🧪 Pruebas unitarias"
            echo "| Pruebas ejecutadas | Fallidas |"
            echo "|---|---|"
            echo "| $TOTAL | $FALLOS |"
            if [ -f target/site/jacoco/jacoco.csv ]; then
              awk -F, 'NR>1 {lm+=$8; lc+=$9; bm+=$6; bc+=$7}
                END {printf "\n## 📊 Cobertura JaCoCo\n| Líneas | Ramas | Mínimo exigido |\n|---|---|---|\n| %.1f %% | %.1f %% | 80 %% |\n",
                     lc*100/(lm+lc), (bm+bc) ? bc*100/(bm+bc) : 100}' target/site/jacoco/jacoco.csv
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # Salidas para el dashboard (las publica el job de despliegue en Prometheus)
          {
            echo "pruebas_total=$TOTAL"
            echo "pruebas_fallidas=$FALLOS"
            if [ -f target/site/jacoco/jacoco.csv ]; then
              awk -F, 'NR>1 {lm+=$8; lc+=$9; bm+=$6; bc+=$7}
                END {printf "cobertura_lineas=%.4f\ncobertura_ramas=%.4f\n", lc/(lm+lc), (bm+bc) ? bc/(bm+bc) : 1}' target/site/jacoco/jacoco.csv
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/

  # 2. Análisis de seguridad de dependencias con Snyk (SCA)
  snyk-scan:
    name: Seguridad de dependencias (Snyk)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}   # Token guardado en GitHub Secrets (la CLI lo lee automáticamente)
    outputs:
      critical: ${{ steps.conteo.outputs.critical }}
      high: ${{ steps.conteo.outputs.high }}
      medium: ${{ steps.conteo.outputs.medium }}
      low: ${{ steps.conteo.outputs.low }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Verificar que exista el secreto SNYK_TOKEN
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error title=Falta SNYK_TOKEN::Crea el secreto SNYK_TOKEN en Settings > Secrets and variables > Actions (ver README)."
            exit 1
          fi

      # Acción oficial de Snyk: descarga la versión fijada y verifica su checksum SHA-256
      - name: Install Snyk CLI
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        with:
          snyk-version: ${{ env.SNYK_CLI_VERSION }}

      # DEMOSTRACIÓN (IE6): se agrega log4j-core 2.14.1, afectada por Log4Shell (CVE-2021-44228, crítica)
      - name: "Simulación: dependencia con vulnerabilidad crítica"
        if: env.SIMULAR_FALLA == 'vulnerabilidad-dependencia'
        run: |
          echo "::warning title=Simulación::Se agrega a propósito log4j-core 2.14.1 (Log4Shell) al pom.xml"
          python3 - <<'EOF'
          from pathlib import Path
          pom = Path("pom.xml")
          dep = ("        <dependency>\n            <groupId>org.apache.logging.log4j</groupId>\n"
                 "            <artifactId>log4j-core</artifactId>\n            <version>2.14.1</version>\n"
                 "        </dependency>\n    </dependencies>")
          pom.write_text(pom.read_text().replace("    </dependencies>", dep, 1))
          EOF
          git diff

      # Reporte completo primero (para el dashboard y como evidencia), luego el bloqueo
      - name: Generate Snyk JSON Report
        run: |
          snyk test --json > snyk-report.json || echo "Snyk encontró vulnerabilidades (ver reporte)"
          ls -lh snyk-report.json

      - name: Contar vulnerabilidades por severidad
        id: conteo
        run: |
          for sev in critical high medium low; do
            n=$(jq --arg s "$sev" '[.vulnerabilities // [] | unique_by(.id)[] | select(.severity == $s)] | length' snyk-report.json 2>/dev/null || echo 0)
            echo "$sev=${n:-0}" >> "$GITHUB_OUTPUT"
            echo "$sev: ${n:-0}"
          done

      # BLOQUEO: si hay vulnerabilidades de severidad alta o crítica el job falla
      # y los jobs de build y despliegue no se ejecutan.
      - name: Snyk test Java dependencies
        run: snyk test --severity-threshold=high

      - name: Upload Snyk JSON Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snyk-report
          path: snyk-report.json
          if-no-files-found: warn

      # ALERTA: registra el proyecto en Snyk, que envía un correo cuando se publica
      # una vulnerabilidad nueva que afecte a las dependencias de main.
      - name: Monitoreo continuo en Snyk
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: snyk monitor --project-name="${{ github.repository }}" || echo "::warning::No se pudo registrar el proyecto en Snyk"

  # 3. Análisis de calidad y seguridad del código con SonarCloud (SAST)
  sonar-analysis:
    name: Calidad de código (SonarCloud)
    runs-on: ubuntu-latest
    needs: test                 # Solo se ejecuta si pasaron las pruebas
    timeout-minutes: 20
    outputs:
      quality-gate: ${{ steps.qg.outputs.aprobado }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   # Token SonarCloud desde Secrets
      # Por defecto se usan los valores que crea SonarCloud al importar el repo desde GitHub.
      # Si los tuyos son distintos, crea las variables SONAR_ORGANIZATION y SONAR_PROJECT_KEY.
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || github.repository_owner }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || format('{0}_{1}', github.repository_owner, github.event.repository.name) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0        # historial completo: Sonar distingue el "código nuevo"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Cache SonarCloud packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Verificar que exista el secreto SONAR_TOKEN
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error title=Falta SONAR_TOKEN::Crea el secreto SONAR_TOKEN en Settings > Secrets and variables > Actions (ver README)."
            exit 1
          fi

      # BLOQUEO: sonar.qualitygate.wait hace que el job falle si no se cumple el Quality Gate
      # (bugs, vulnerabilidades, security hotspots, duplicación o cobertura bajo el umbral).
      - name: Run SonarCloud Analysis
        run: |
          mvn -B -ntp verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.organization="${SONAR_ORGANIZATION,,}" \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

      - name: Quality Gate aprobado
        id: qg
        run: echo "aprobado=1" >> "$GITHUB_OUTPUT"

  # 4. Validación de los manifiestos de Kubernetes (estrategia de orquestación alternativa)
  validate-k8s:
    name: Validar manifiestos Kubernetes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Se valida exactamente lo que se despliega: overlay de la nube con la imagen del commit,
      # el overlay local y los recursos de observabilidad (PodMonitor, PrometheusRule, dashboard)
      - name: Renderizar manifiestos con Kustomize
        run: |
          bash scripts/k8s/renderizar.sh "ghcr.io/${GITHUB_REPOSITORY,,}:validacion-${GITHUB_SHA::7}" > k8s-render.yaml
          echo "---" >> k8s-render.yaml
          kubectl kustomize k8s/overlays/local >> k8s-render.yaml
          echo "---" >> k8s-render.yaml
          bash scripts/k8s/renderizar-observabilidad.sh >> k8s-render.yaml
          grep -c '^kind:' k8s-render.yaml

      # Los recursos del Prometheus Operator (CRD) se validan con el catálogo de esquemas de CRDs
      - name: Validar contra el esquema oficial de Kubernetes (kubeconform)
        run: |
          docker run --rm -v "$PWD:/work" ghcr.io/yannh/kubeconform:v0.8.0 \
            -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /work/k8s-render.yaml

  # 4b. Auditoría de cumplimiento (IE5): secretos, Dockerfile, políticas de Kubernetes
  #     y configuración del repositorio, con reporte mapeado a normas (ISO 27001, CIS, OWASP)
  auditoria-cumplimiento:
    name: Auditoría de cumplimiento
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      CONFTEST_VERSION: 0.71.1
      HADOLINT_VERSION: 2.15.1
    outputs:
      aprobados: ${{ steps.auditoria.outputs.aprobados }}
      fallidos: ${{ steps.auditoria.outputs.fallidos }}
      advertencias: ${{ steps.auditoria.outputs.advertencias }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0        # gitleaks revisa también el historial de commits

      # Igual que con Snyk: versión fija y verificación del checksum SHA-256 de cada binario
      - name: Instalar herramientas de auditoría
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin" && cd "$RUNNER_TEMP"
          descargar() { curl -fsSL -o "$1" "$2"; echo "$3  $1" | sha256sum -c -; }
          descargar gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          descargar conftest.tgz "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            c3f6b2a753bd56e377a1e51a95ae3e057f926f2e9139f7d5b5dfbbaf810f7985
          descargar hadolint "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64" \
            c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
          tar xzf gitleaks.tgz -C "$HOME/bin" gitleaks
          tar xzf conftest.tgz -C "$HOME/bin" conftest
          install -m 0755 hadolint "$HOME/bin/hadolint"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      # DEMOSTRACIÓN (IE6): credenciales "olvidadas" en un archivo de configuración.
      # Se generan al azar en cada ejecución: no son credenciales reales.
      - name: "Simulación: secreto expuesto en el código"
        if: env.SIMULAR_FALLA == 'secreto-expuesto'
        run: |
          echo "::warning title=Simulación::Se agregan a propósito credenciales falsas a src/main/resources/application-nube.properties"
          python3 - <<'EOF'
          import secrets, string
          az = string.ascii_uppercase + "234567"
          clave = "AKIA" + "".join(secrets.choice(az) for _ in range(16))
          secreto = secrets.token_urlsafe(30)
          token = "ghp_" + "".join(secrets.choice(string.ascii_letters + string.digits) for _ in range(36))
          with open("src/main/resources/application-nube.properties", "w") as f:
              f.write(f"aws.access-key-id={clave}\naws.secret-access-key={secreto}\ngithub.token={token}\n")
          EOF

      - name: Ejecutar auditoría
        id: auditoria
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # solo lectura: consulta la protección de la rama
        run: |
          VERSION=$(python3 -c "import xml.etree.ElementTree as E; n={'m':'http://maven.apache.org/POM/4.0.0'}; print(E.parse('pom.xml').getroot().find('m:version', n).text)")
          SIMULACION_K8S=ninguna
          [ "$SIMULAR_FALLA" = "politica-kubernetes" ] && SIMULACION_K8S=politica-kubernetes
          python3 scripts/cumplimiento/auditoria.py \
            --imagen "ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION}-${GITHUB_SHA::7}" \
            --simulacion-k8s "$SIMULACION_K8S" \
            --repo "$GITHUB_REPOSITORY"

      - name: Guardar reporte de auditoría (evidencia)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-cumplimiento
          path: |
            reporte-cumplimiento.json
            reporte-cumplimiento.md
          if-no-files-found: warn

  # 5. Construcción de la imagen Docker + escaneo de la imagen + publicación
  build-image:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    # Solo si pasaron pruebas, análisis de seguridad, auditoría de cumplimiento y validación de manifiestos
    needs: [test, snyk-scan, sonar-analysis, auditoria-cumplimiento, validate-k8s]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write           # único job con permiso para publicar en GitHub Container Registry
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      vuln-critical: ${{ steps.conteo.outputs.critical }}
      vuln-high: ${{ steps.conteo.outputs.high }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      # Etiqueta = versión del pom + commit corto (ej: 1.0.0-a1b2c3d) -> trazabilidad commit/imagen
      - name: Definir versión y etiquetas de la imagen
        id: meta
        run: |
          VERSION=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
          TAG="${VERSION}-${GITHUB_SHA::7}"
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          {
            echo "IMAGE=${IMAGE_NAME}:${TAG}"
            echo "REGISTRY_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # El Dockerfile es multi-stage: dependencias -> tests -> compilación -> producción.
      # Si alguna prueba falla dentro del build, la imagen no se genera.
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspeccionar imagen
        run: |
          docker image ls "$IMAGE_NAME"
          {
            echo "## 🐳 Imagen construida"
            echo "| Imagen | Tamaño | Commit |"
            echo "|---|---|---|"
            echo "| \`$IMAGE\` | $(docker image inspect "$IMAGE" --format '{{.Size}}' | awk '{printf "%.0f MB", $1/1024/1024}') | \`${GITHUB_SHA::7}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Acción oficial de Snyk: descarga la versión fijada y verifica su checksum SHA-256
      - name: Install Snyk CLI
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        with:
          snyk-version: ${{ env.SNYK_CLI_VERSION }}

      # BLOQUEO: no se publica ni despliega una imagen con vulnerabilidades críticas
      # (revisa el sistema operativo base y las librerías del .jar).
      - name: Snyk container test
        run: snyk container test "$IMAGE" --file=Dockerfile --severity-threshold=critical

      - name: Generate Snyk container report
        if: always()
        run: snyk container test "$IMAGE" --file=Dockerfile --json > snyk-container-report.json || true

      - name: Contar vulnerabilidades de la imagen
        id: conteo
        if: always()
        run: |
          for sev in critical high; do
            n=$(jq --arg s "$sev" '[.. | objects | select(has("vulnerabilities")) | .vulnerabilities[]?] | unique_by(.id) | map(select(.severity == $s)) | length' snyk-container-report.json 2>/dev/null || echo 0)
            echo "$sev=${n:-0}" >> "$GITHUB_OUTPUT"
          done

      - name: Upload Snyk container report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snyk-container-report
          path: snyk-container-report.json
          if-no-files-found: warn

      # Se guarda la imagen para que el despliegue use exactamente la misma que se probó
      - name: Guardar imagen como artefacto
        run: docker save "$IMAGE" | gzip > ms-productos-image.tar.gz

      - name: Upload Docker image
        uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: ms-productos-image.tar.gz
          retention-days: 7

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen en GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          TAG=${{ steps.meta.outputs.tag }}
          docker tag "$IMAGE" "$REGISTRY_IMAGE:$TAG"
          docker tag "$IMAGE" "$REGISTRY_IMAGE:latest"
          docker push "$REGISTRY_IMAGE:$TAG"
          docker push "$REGISTRY_IMAGE:latest"
          DIGEST=$(docker image inspect "$REGISTRY_IMAGE:$TAG" --format '{{index .RepoDigests 0}}')
          {
            echo ""
            echo "Publicada en el registro: \`$REGISTRY_IMAGE:$TAG\`"
            echo ""
            echo "Digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # 6. Staging con observabilidad (Docker Compose): la misma imagen se levanta con
  #    Prometheus, Grafana, Loki, Alloy y Pushgateway, y se comprueba que métricas, logs,
  #    alertas y dashboard funcionan ANTES de llegar a producción. Corre también en los PR.
  staging:
    name: Staging con observabilidad (Docker Compose)
    runs-on: ubuntu-latest
    needs: [test, snyk-scan, sonar-analysis, auditoria-cumplimiento, build-image]
    timeout-minutes: 25
    env:
      IMAGE: ms-productos:${{ needs.build-image.outputs.image-tag }}
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.observabilidad.yml

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Descargar la imagen construida
        uses: actions/download-artifact@v8
        with:
          name: docker-image

      - name: Cargar imagen en Docker
        run: gunzip -c ms-productos-image.tar.gz | docker load

      # Las credenciales se generan al azar en cada despliegue: nunca quedan en el repositorio
      - name: Generar configuración del entorno
        run: |
          {
            echo "APP_IMAGE=$IMAGE"
            echo "ENTORNO=staging"
            echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 16)"
            echo "MYSQL_PASSWORD=$(openssl rand -hex 16)"
            echo "GRAFANA_ADMIN_PASSWORD=$(openssl rand -hex 16)"
          } > .env

      - name: Desplegar stack (nginx + 2 réplicas + MySQL + observabilidad)
        id: despliegue
        run: |
          INICIO=$(date +%s)
          $COMPOSE up -d --no-build --wait --wait-timeout 300
          echo "duracion=$(( $(date +%s) - INICIO ))" >> "$GITHUB_OUTPUT"
          $COMPOSE ps

      - name: Smoke tests sobre el entorno desplegado
        run: bash scripts/smoke-test.sh http://localhost:8080 2

      - name: Prueba de escalabilidad horizontal (3 réplicas)
        run: |
          $COMPOSE up -d --no-build --wait --wait-timeout 240 --scale app=3
          sleep 15   # nginx vuelve a resolver el DNS de las réplicas cada 10 s
          bash scripts/smoke-test.sh http://localhost:8080 3

      - name: Generar tráfico (lecturas, escrituras y errores esperados)
        run: bash scripts/observabilidad/generar-trafico.sh http://localhost:8080 40

      - name: Publicar métricas del pipeline (Pushgateway de staging)
        env:
          PUSHGATEWAY_URL: http://127.0.0.1:9091
          ENTORNO: staging
          DURACION_DESPLIEGUE: ${{ steps.despliegue.outputs.duracion }}
          VERSION: ${{ needs.build-image.outputs.version }}
          COMMIT: ${{ github.sha }}
          EJECUCION: ${{ github.run_number }}
          COBERTURA_LINEAS: ${{ needs.test.outputs.cobertura-lineas }}
          COBERTURA_RAMAS: ${{ needs.test.outputs.cobertura-ramas }}
          PRUEBAS_TOTAL: ${{ needs.test.outputs.pruebas-total }}
          PRUEBAS_FALLIDAS: ${{ needs.test.outputs.pruebas-fallidas }}
          QUALITY_GATE: ${{ needs.sonar-analysis.outputs.quality-gate }}
          VULN_DEP_CRITICAL: ${{ needs.snyk-scan.outputs.critical }}
          VULN_DEP_HIGH: ${{ needs.snyk-scan.outputs.high }}
          VULN_DEP_MEDIUM: ${{ needs.snyk-scan.outputs.medium }}
          VULN_DEP_LOW: ${{ needs.snyk-scan.outputs.low }}
          VULN_IMG_CRITICAL: ${{ needs.build-image.outputs.vuln-critical }}
          VULN_IMG_HIGH: ${{ needs.build-image.outputs.vuln-high }}
          AUDITORIA_APROBADOS: ${{ needs.auditoria-cumplimiento.outputs.aprobados }}
          AUDITORIA_FALLIDOS: ${{ needs.auditoria-cumplimiento.outputs.fallidos }}
          AUDITORIA_ADVERTENCIAS: ${{ needs.auditoria-cumplimiento.outputs.advertencias }}
          GH_TOKEN: ${{ github.token }}   # gh lee la hora de inicio de la ejecución (lead time)
        run: |
          INICIO_EJECUCION=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          export DURACION_PIPELINE=$(( $(date +%s) - $(date -d "$INICIO_EJECUCION" +%s) ))
          bash scripts/observabilidad/publicar-metricas-cicd.sh

      - name: Verificar observabilidad (métricas, alertas, logs y dashboard)
        run: VERIFICAR_CICD=true bash scripts/observabilidad/verificar-observabilidad.sh 3

      - name: Capturar el dashboard de Grafana (evidencia)
        continue-on-error: true
        run: |
          npx -y "playwright@${PLAYWRIGHT_VERSION}" install --with-deps chromium > /dev/null
          npx -y "playwright@${PLAYWRIGHT_VERSION}" screenshot --browser chromium --full-page \
            --viewport-size "1600, 3000" --wait-for-timeout 15000 \
            "http://127.0.0.1:3000/d/ms-productos-devops/?orgId=1&from=now-15m&to=now&kiosk" dashboard-staging.png

      - name: Registro del despliegue (trazabilidad)
        run: |
          INFO=$(curl -fsS http://localhost:8080/api/info)
          {
            echo "## 🧪 Staging con observabilidad"
            echo "| Dato | Valor |"
            echo "|---|---|"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Imagen | \`$IMAGE\` |"
            echo "| Tiempo de despliegue | ${{ steps.despliegue.outputs.duracion }} s |"
            echo "| Respuesta de /api/info | \`$INFO\` |"
            echo "| Verificado | métricas de 3 réplicas, reglas de alerta, logs en Loki y dashboard en Grafana |"
            echo ""
            echo "La captura del dashboard queda en el artefacto \`dashboard-staging\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar logs y alertas del entorno
        if: always()
        run: |
          $COMPOSE logs --no-color --timestamps > deploy-logs.txt
          curl -s http://127.0.0.1:9090/api/v1/alerts > alertas-prometheus.json || true

      - name: Upload deploy logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deploy-logs
          path: |
            deploy-logs.txt
            alertas-prometheus.json

      - name: Upload dashboard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-staging
          path: dashboard-staging.png
          if-no-files-found: ignore

      - name: Bajar el entorno
        if: always()
        run: $COMPOSE down -v

  # 7. Despliegue en producción: Kubernetes en la nube (Azure AKS)
  #    - instala/actualiza la plataforma de observabilidad del clúster (Helm, versiones fijas)
  #    - despliega con rolling update, pruebas de humo y verificación con Prometheus
  #    - ante cualquier falla hace ROLLBACK automático (la versión anterior sigue atendiendo)
  #    Si todavía no existe el secreto KUBECONFIG_AKS, usa un clúster efímero (kind) en el runner.
  deploy:
    name: Despliegue en Kubernetes (producción)
    runs-on: ubuntu-latest
    needs: [test, snyk-scan, sonar-analysis, auditoria-cumplimiento, build-image, staging]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    timeout-minutes: 45
    concurrency:
      group: produccion           # nunca dos despliegues a la vez sobre el mismo clúster
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read               # leer la hora de inicio de la ejecución (lead time)
      packages: read
    # El environment guarda la credencial del clúster y registra cada despliegue
    environment:
      name: produccion
      url: ${{ steps.urls.outputs.api || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
    env:
      IMAGE_TAG: ${{ needs.build-image.outputs.image-tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Elegir el clúster
        id: cluster
        env:
          KUBECONFIG_AKS: ${{ secrets.KUBECONFIG_AKS }}
        run: |
          if [ -n "$KUBECONFIG_AKS" ]; then
            mkdir -p ~/.kube
            echo "$KUBECONFIG_AKS" | base64 -d > ~/.kube/config
            chmod 600 ~/.kube/config
            echo "proveedor=aks" >> "$GITHUB_OUTPUT"
            echo "imagen=ghcr.io/${GITHUB_REPOSITORY,,}:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Sin clúster en la nube::No existe el secreto KUBECONFIG_AKS; se usa un clúster Kubernetes efímero (kind). Ver infra/azure/crear-cluster.sh"
            echo "proveedor=kind" >> "$GITHUB_OUTPUT"
            echo "imagen=ms-productos:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Crear clúster efímero (kind)
        if: steps.cluster.outputs.proveedor == 'kind'
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: ms-productos

      - name: Cargar la imagen en kind
        if: steps.cluster.outputs.proveedor == 'kind'
        run: |
          gh run download "$GITHUB_RUN_ID" -n docker-image
          gunzip -c ms-productos-image.tar.gz | docker load
          kind load docker-image "ms-productos:$IMAGE_TAG" --name ms-productos
        env:
          GH_TOKEN: ${{ github.token }}

      # AKS descarga la imagen desde GHCR. Si el paquete es privado se crea un secreto de
      # descarga (y se avisa: lo recomendado es dejar el paquete público o usar un token propio).
      - name: Acceso del clúster a la imagen
        if: steps.cluster.outputs.proveedor == 'aks'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kubectl get nodes -o wide
          kubectl create namespace ms-productos --dry-run=client -o yaml | kubectl apply -f -
          if docker manifest inspect "${{ steps.cluster.outputs.imagen }}" > /dev/null 2>&1; then
            echo "Imagen pública en GHCR: el clúster la descarga sin credenciales"
          else
            echo "::warning title=Paquete privado::Haz público el paquete ms-productos en GitHub (Packages > Package settings > Change visibility)"
            kubectl -n ms-productos create secret docker-registry ghcr-descarga \
              --docker-server=ghcr.io --docker-username="$GITHUB_ACTOR" --docker-password="$GH_TOKEN" \
              --dry-run=client -o yaml | kubectl apply -f -
            kubectl -n ms-productos patch serviceaccount default -p '{"imagePullSecrets":[{"name":"ghcr-descarga"}]}'
          fi

      - name: Instalar/actualizar plataforma de observabilidad (Helm)
        run: bash scripts/k8s/instalar-plataforma.sh

      - name: Desplegar con verificación y rollback automático
        id: desplegar
        env:
          IMAGEN: ${{ steps.cluster.outputs.imagen }}
          PROVEEDOR: ${{ steps.cluster.outputs.proveedor }}
          SIMULACION: ${{ env.SIMULAR_FALLA == 'despliegue-defectuoso' && 'despliegue-defectuoso' || 'ninguna' }}
        run: bash scripts/k8s/desplegar.sh

      - name: Abrir túneles a la plataforma de observabilidad
        run: |
          kubectl -n monitoring port-forward svc/pushgateway 9091:9091 > /dev/null 2>&1 &
          kubectl -n monitoring port-forward svc/kube-prometheus-stack-prometheus 9090:9090 > /dev/null 2>&1 &
          kubectl -n monitoring port-forward svc/loki 3100:3100 > /dev/null 2>&1 &
          kubectl -n monitoring port-forward svc/kube-prometheus-stack-grafana 3000:80 > /dev/null 2>&1 &
          kubectl -n ms-productos port-forward svc/ms-productos 8080:80 > /dev/null 2>&1 &
          sleep 8

      - name: Publicar métricas del pipeline en Prometheus (Pushgateway)
        env:
          GH_TOKEN: ${{ github.token }}
          PUSHGATEWAY_URL: http://127.0.0.1:9091
          ENTORNO: produccion
          DURACION_DESPLIEGUE: ${{ steps.desplegar.outputs.duracion_despliegue }}
          VERSION: ${{ needs.build-image.outputs.version }}
          COMMIT: ${{ github.sha }}
          EJECUCION: ${{ github.run_number }}
          COBERTURA_LINEAS: ${{ needs.test.outputs.cobertura-lineas }}
          COBERTURA_RAMAS: ${{ needs.test.outputs.cobertura-ramas }}
          PRUEBAS_TOTAL: ${{ needs.test.outputs.pruebas-total }}
          PRUEBAS_FALLIDAS: ${{ needs.test.outputs.pruebas-fallidas }}
          QUALITY_GATE: ${{ needs.sonar-analysis.outputs.quality-gate }}
          VULN_DEP_CRITICAL: ${{ needs.snyk-scan.outputs.critical }}
          VULN_DEP_HIGH: ${{ needs.snyk-scan.outputs.high }}
          VULN_DEP_MEDIUM: ${{ needs.snyk-scan.outputs.medium }}
          VULN_DEP_LOW: ${{ needs.snyk-scan.outputs.low }}
          VULN_IMG_CRITICAL: ${{ needs.build-image.outputs.vuln-critical }}
          VULN_IMG_HIGH: ${{ needs.build-image.outputs.vuln-high }}
          AUDITORIA_APROBADOS: ${{ needs.auditoria-cumplimiento.outputs.aprobados }}
          AUDITORIA_FALLIDOS: ${{ needs.auditoria-cumplimiento.outputs.fallidos }}
          AUDITORIA_ADVERTENCIAS: ${{ needs.auditoria-cumplimiento.outputs.advertencias }}
        run: |
          INICIO_EJECUCION=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          export DURACION_PIPELINE=$(( $(date +%s) - $(date -d "$INICIO_EJECUCION" +%s) ))
          bash scripts/observabilidad/publicar-metricas-cicd.sh

      - name: Generar tráfico y verificar observabilidad en el clúster
        run: |
          bash scripts/observabilidad/generar-trafico.sh http://127.0.0.1:8080 30
          VERIFICAR_CICD=true bash scripts/observabilidad/verificar-observabilidad.sh 2

      - name: Capturar el dashboard de Grafana (evidencia)
        continue-on-error: true
        run: |
          npx -y "playwright@${PLAYWRIGHT_VERSION}" install --with-deps chromium > /dev/null
          npx -y "playwright@${PLAYWRIGHT_VERSION}" screenshot --browser chromium --full-page \
            --viewport-size "1600, 3000" --wait-for-timeout 15000 \
            "http://127.0.0.1:3000/d/ms-productos-devops/?orgId=1&from=now-6h&to=now&kiosk" dashboard-produccion.png

      - name: Direcciones públicas
        id: urls
        if: steps.cluster.outputs.proveedor == 'aks'
        run: |
          API=$(kubectl -n ms-productos get svc ms-productos -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          GRAFANA=$(kubectl -n monitoring get svc kube-prometheus-stack-grafana -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          [ -n "$API" ] && echo "api=http://$API/api/productos" >> "$GITHUB_OUTPUT"
          {
            echo "## 🌐 Producción en Azure Kubernetes Service"
            echo "| Servicio | Dirección |"
            echo "|---|---|"
            echo "| API | http://$API/api/productos |"
            echo "| Grafana (solo lectura sin login) | http://$GRAFANA/d/ms-productos-devops |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Estado del clúster (evidencia)
        if: always()
        run: |
          {
            kubectl get nodes -o wide
            kubectl -n ms-productos get all,pdb,networkpolicy,podmonitor,prometheusrule -o wide
            kubectl -n ms-productos rollout history deployment/ms-productos
            kubectl -n monitoring get pods,svc
          } > estado-cluster.txt 2>&1 || true
          cat estado-cluster.txt

      - name: Upload evidencia del despliegue
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidencia-produccion
          path: |
            estado-cluster.txt
            dashboard-produccion.png
          if-no-files-found: ignore

  # 7. En los Pull Requests: bloquea dependencias nuevas con vulnerabilidades altas
  dependency-review:
    name: Revisión de dependencias del PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # 8. ALERTA: si cualquier etapa falla en main se abre un issue automáticamente
  alerta-fallo:
    name: Alerta de fallo del pipeline
    runs-on: ubuntu-latest
    needs: [test, snyk-scan, sonar-analysis, auditoria-cumplimiento, validate-k8s, build-image, staging, deploy]
    if: failure() && github.event_name != 'pull_request'
    permissions:
      issues: write

    steps:
      - name: Crear issue de alerta
        uses: actions/github-script@v9
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS);
            const fallidos = Object.entries(needs)
              .filter(([, job]) => job.result === 'failure')
              .map(([nombre]) => `- \`${nombre}\``);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const rama = context.ref.replace('refs/heads/', '');
            const issue = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Pipeline fallido en ${rama} (${context.sha.substring(0, 7)})`,
              body: [
                `El pipeline **${context.workflow}** falló y el despliegue fue bloqueado.`,
                '',
                '**Etapas que fallaron:**',
                ...fallidos,
                '',
                `- Commit: ${context.sha}`,
                `- Autor: @${context.actor}`,
                `- Ejecución: ${runUrl}`,
                '',
                ...(process.env.SIMULAR_FALLA !== 'ninguna' ? ['', `> Ejecución de demostración: falla simulada **${process.env.SIMULAR_FALLA}**.`] : []),
                '',
                'Revisa los artefactos `snyk-report`, `snyk-container-report`, `reporte-cumplimiento`, `jacoco-report` y `evidencia-produccion` de la ejecución.'
              ].join('\n')
            };
            try {
              await github.rest.issues.create({ ...issue, labels: ['pipeline-fallido'] });
            } catch (error) {
              core.warning(`No se pudo crear el issue con etiqueta (${error.message}); se crea sin etiqueta.`);
              await github.rest.issues.create(issue);
            }
