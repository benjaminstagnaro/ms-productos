apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-productos
  labels:
    app: ms-productos
spec:
  replicas: 2
  # Rolling update sin caída: primero levanta un pod nuevo y luego baja uno antiguo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ms-productos
  revisionHistoryLimit: 5          # versiones anteriores disponibles para "kubectl rollout undo"
  template:
    metadata:
      labels:
        app: ms-productos
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Espera a que MySQL acepte conexiones antes de arrancar la app: evita reinicios
      # (y falsas caídas en el dashboard) en el primer despliegue o tras reiniciar MySQL.
      initContainers:
        - name: esperar-mysql
          image: mysql:8.4
          command: ["sh", "-c", "until mysqladmin ping -h mysql --connect-timeout=2 --silent; do echo 'esperando a MySQL...'; sleep 3; done"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: ms-productos
          image: ms-productos       # Kustomize la reemplaza por la imagen de GHCR
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            # Puerto de gestión interno: health, sondas y /actuator/prometheus
            - name: management
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: ms-productos-config
          env:
            - name: APP_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: ms-productos-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ms-productos-secret
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          # Spring Boot expone estos endpoints con management.endpoint.health.probes.enabled
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
