# Balancea el tráfico entre todos los pods "Ready" del Deployment.
# Solo publica la API (8080); el puerto de gestión 8081 queda dentro del clúster.
# Cada overlay decide cómo se expone: NodePort (local) o LoadBalancer con IP pública (nube).
apiVersion: v1
kind: Service
metadata:
  name: ms-productos
  labels:
    app: ms-productos
spec:
  type: ClusterIP
  selector:
    app: ms-productos
  ports:
    - name: http
      port: 80
      targetPort: http
