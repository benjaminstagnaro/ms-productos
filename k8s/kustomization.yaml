# Despliegue en Kubernetes:  kubectl apply -k k8s/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ms-productos

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - mysql.yaml
  - app-deployment.yaml
  - app-service.yaml
  - hpa.yaml
  - pdb.yaml
  - network-policy.yaml

# Imagen a desplegar: cambiar por la publicada por el pipeline en GHCR
images:
  - name: ms-productos
    newName: ghcr.io/benjaminstagnaro/ms-productos
    newTag: latest
