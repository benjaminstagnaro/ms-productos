# Valores de ejemplo para un clúster local de pruebas.
# En un entorno real NO se versionan: se crean con
#   kubectl create secret generic ms-productos-secret --from-literal=...
# o se gestionan con Sealed Secrets / External Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: ms-productos-secret
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: cambiar-root
  DB_USER: productos
  DB_PASSWORD: cambiar-password
