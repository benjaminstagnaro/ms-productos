# Balancea el tráfico entre todos los pods "Ready" del Deployment.
# NodePort permite probarlo en un clúster local: http://localhost:30080
apiVersion: v1
kind: Service
metadata:
  name: ms-productos
  labels:
    app: ms-productos
spec:
  type: NodePort
  selector:
    app: ms-productos
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
