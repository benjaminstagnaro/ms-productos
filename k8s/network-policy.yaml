# Seguridad de red: MySQL solo acepta conexiones desde los pods del microservicio
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql-solo-desde-app
spec:
  podSelector:
    matchLabels:
      app: mysql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ms-productos
      ports:
        - protocol: TCP
          port: 3306
