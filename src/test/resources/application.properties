spring.application.name=ms-productos

# Las pruebas usan H2 en memoria para no depender de MySQL
spring.datasource.url=jdbc:h2:mem:productos_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# En las pruebas Actuator usa el mismo puerto que la API (MockMvc no levanta el puerto 8081)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true

app.version=test
app.commit=test-commit
