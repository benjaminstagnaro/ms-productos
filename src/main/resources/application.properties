spring.application.name=ms-productos
server.port=8080
server.shutdown=graceful

# La conexión se inyecta por variables de entorno (Docker Compose / Kubernetes).
# Los valores por defecto solo sirven para ejecutar en local.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/productos_db}
spring.datasource.username=${DB_USER:productos}
spring.datasource.password=${DB_PASSWORD:productos}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ===== Observabilidad =====
# Actuator escucha en un puerto de gestión interno (8081) separado de la API (8080):
# las métricas y el detalle de salud no quedan expuestos a Internet. Prometheus y las
# sondas de Kubernetes/Docker usan el 8081; el balanceador solo publica el 8080.
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
# /livez y /readyz también quedan disponibles en el puerto de la API (sin detalles)
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.show-details=never

# Logs estructurados en JSON (formato Elastic Common Schema): Loki/Grafana pueden
# filtrar por nivel, logger, request_id, etc. sin expresiones regulares.
logging.structured.format.console=${LOG_FORMAT:ecs}
logging.structured.ecs.service.name=${spring.application.name}
logging.structured.ecs.service.version=${APP_VERSION:dev}
logging.structured.ecs.service.environment=${APP_ENV:local}

# Trazabilidad: valores que el pipeline graba en la imagen Docker
app.version=${APP_VERSION:dev}
app.commit=${GIT_COMMIT:local}
