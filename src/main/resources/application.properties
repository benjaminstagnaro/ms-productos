spring.application.name=ms-productos
server.port=8080
server.shutdown=graceful

# La conexión se inyecta por variables de entorno (Docker Compose / Kubernetes).
# Los valores por defecto solo sirven para ejecutar en local.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/productos_db}
spring.datasource.username=${DB_USER:productos}
spring.datasource.password=${DB_PASSWORD:productos}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Actuator: solo se exponen health e info (mínima superficie de ataque)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Trazabilidad: valores que el pipeline graba en la imagen Docker
app.version=${APP_VERSION:dev}
app.commit=${GIT_COMMIT:local}
