# Balanceador de carga para las réplicas de "app".
# Se usa el DNS interno de Docker (127.0.0.11) con una variable en proxy_pass para que
# nginx vuelva a resolver el nombre cada 10 s: así detecta réplicas nuevas al escalar.
server {
    listen 80;
    server_tokens off;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://app:8080;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # Si una réplica falla, la petición se reintenta en otra
        proxy_next_upstream error timeout http_502 http_503;
    }
}
